<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#342c25" />
  <meta name="description" content="Loopen — 把常用的，都收在這裡。" />
  <title>Loopen</title>
  <link rel="icon" href="assets/loopen-logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="app-management.css" />
  <link rel="stylesheet" href="atmosphere.css" />
  <link rel="stylesheet" href="reference-background.css" />
  <link rel="stylesheet" href="background-sharpness.css" />
</head>
<body>
  <div class="page-shell">
    <header class="hero" aria-labelledby="brand-title">
      <div class="hero-glow hero-glow-a" aria-hidden="true"></div>
      <div class="hero-glow hero-glow-b" aria-hidden="true"></div>

      <div class="hero-topline">
        <div class="brand-lockup">
          <img class="brand-mark" src="assets/loopen-logo.svg" alt="" width="48" height="48" />
          <div>
            <h1 class="brand-name" id="brand-title">Loopen</h1>
            <p class="brand-subtitle">把常用的，都收在這裡</p>
          </div>
        </div>

        <div class="settings-wrap">
          <button class="icon-button hero-settings" id="settingsButton" type="button" aria-label="Loopen 設定" aria-expanded="false">•••</button>
          <div class="popover" id="settingsMenu" hidden>
            <button type="button" data-setting-action="reset">重設範例資料 <span>↺</span></button>
          </div>
        </div>
      </div>

      <div class="hero-search-row">
        <label class="search-pill" for="searchInput">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" autocomplete="off" placeholder="搜尋 App" />
        </label>
      </div>
    </header>

    <span id="greeting" hidden aria-hidden="true"></span>

    <main id="categoryList" aria-live="polite"></main>

    <button class="add-category-button" id="addCategoryButton" type="button">
      <span aria-hidden="true">＋</span>
      <span>新增分類</span>
    </button>
  </div>

  <dialog class="dialog" id="formDialog">
    <form class="dialog-card" id="dialogForm" method="dialog" novalidate>
      <div class="dialog-head">
        <div>
          <h2 id="dialogTitle">新增</h2>
          <p id="dialogDescription"></p>
        </div>
        <button class="dialog-close" id="dialogClose" type="button" aria-label="關閉">×</button>
      </div>
      <div class="dialog-fields" id="dialogFields"></div>
      <div class="dialog-actions">
        <button class="button button-quiet" id="dialogCancel" type="button">取消</button>
        <button class="button button-primary" id="dialogSubmit" type="submit">完成</button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog" id="confirmDialog">
    <div class="dialog-card confirm-card">
      <div>
        <h2 id="confirmTitle">確認刪除？</h2>
        <p id="confirmDescription"></p>
      </div>
      <div class="dialog-actions">
        <button class="button button-quiet" id="confirmCancel" type="button">取消</button>
        <button class="button button-primary" id="confirmSubmit" type="button">刪除</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span class="toast-dot" aria-hidden="true"></span>
    <span id="toastText"></span>
  </div>

  <script src="app.js" defer></script>
  <script src="pwa-icons.js" defer></script>
  <script src="app-management.js" defer></script>
</body>
</html>
